[project]
name = "mr-kelsey"
version = "0.1.0"
description = "Personal resume/portfolio site"
requires-python = ">=3.10"
dependencies = [
    "fastlite",
    "python-fasthtml",
    "resend",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
